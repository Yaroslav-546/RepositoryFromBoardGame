<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Рандомизатор карт событий</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #252525 0%, #111 45%, #080808 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 20px;
        }

        .counter {
            display: inline-block;
            padding: 8px 16px;
            margin-bottom: 20px;
            border-radius: 20px;
            background: #222;
            color: #ccc;
            font-size: 14px;
        }

        /* ОБЛАСТЬ КАРТЫ */

        .card-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .card {
            width: 360px;
            max-width: 100%;
            background: #151515;
            border-radius: 14px;
            overflow: hidden;
            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255,255,255,0.08);
        }

        /*
            ВАЖНО:
            Карта имеет размер 360x327.
            Никакого cover — иначе изображение обрежется.
        */

        .card-image {
            width: 100%;
            max-width: 360px;
            height: auto;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }

        .card-info {
            padding: 18px;
        }

        .card-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card-description {
            color: #ccc;
            line-height: 1.5;
            font-size: 16px;
        }

        .placeholder {
            width: 360px;
            max-width: 100%;
            min-height: 327px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 14px;
            background: #181818;
            border: 2px dashed #444;

            color: #777;
            font-size: 18px;
        }

        /* КНОПКИ */

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 14px 24px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            background: #e5e5e5;
            color: #111;

            transition:
                transform 0.15s,
                background 0.15s;
        }

        button:hover {
            transform: translateY(-2px);
            background: white;
        }

        button:active {
            transform: translateY(0);
        }

        .reset-button {
            background: #292929;
            color: white;
        }

        .reset-button:hover {
            background: #383838;
        }

        /* АНИМАЦИЯ */

        .card.appear {
            animation: appear 0.35s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* МОБИЛЬНАЯ ВЕРСИЯ */

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }

            h1 {
                font-size: 25px;
            }

            .card {
                width: 360px;
                max-width: 100%;
            }

            .card-image {
                width: 100%;
                height: auto;
            }

            .placeholder {
                width: 100%;
                min-height: 280px;
            }

            button {
                width: 100%;
                max-width: 360px;
            }
        }
    </style>
</head>

<body>

<div class="game">

    <h1>🎴 Рандомизатор событий</h1>

    <div class="subtitle">
        «Последний злодей»
    </div>

    <div class="counter" id="counter">
        Осталось карт: 11
    </div>

    <div class="card-container" id="cardContainer">

        <div class="placeholder">
            Нажми «Вытянуть карту»
        </div>

    </div>

    <div class="buttons">

        <button onclick="drawCard()">
            🎴 Вытянуть карту
        </button>

        <button
            class="reset-button"
            onclick="resetDeck()"
        >
            🔄 Новая колода
        </button>

    </div>

</div>


<script>

    /*
    ==========================================
    КАРТИНКИ
    ==========================================
    */

    const cardImages = {
        "Городская паника":
            "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/01_city_panic.png",

        "Кража века":
            "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/02_heist.png",

        "Предательство":
            "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/03_betrayal.png",

        "Чёрный рынок":
            "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/04_black_market.png",

        "Счастливый случай":
            "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/05_lucky_break.png",

        "Двойной ход":
            "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/06_double_move.png",

        "Полицейский рейд":
            "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/07_police_raid.png",

        "Подстава":
            "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/08_setup.png",

        "Облава":
            "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/09_roundup.png",

        "Короткий путь":
            "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/10_shortcut.png",

        "Чёрный день":
            "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/11_black_day.png"

    };


    /*
    ==========================================
    КАРТЫ
    ==========================================
    */

    const events = [

        {
            name: "Городская паника",
            description:
                "Все игроки, кроме тебя, теряют <b>20 HP</b>."
        },

        {
            name: "Кража века",
            description:
                "Выбери любого игрока. Он теряет <b>20 HP</b>, а ты восстанавливаешь <b>20 HP</b>."
        },

        {
            name: "Предательство",
            description:
                "Выбери игрока. При его следующем попадании на ловушку ловушка наносит ему <b>двойной эффект</b>."
        },

        {
            name: "Чёрный рынок",
            description:
                "Восстанови <b>25 HP</b>."
        },

        {
            name: "Счастливый случай",
            description:
                "Восстанови <b>40 HP</b>."
        },

        {
            name: "Двойной ход",
            description:
                "Сразу после окончания своего хода брось кубик ещё раз и сделай дополнительный ход."
        },

        {
            name: "Полицейский рейд",
            description:
                "Выбранная территория временно перестаёт наносить урон."
        },

        {
            name: "Подстава",
            description:
                "Перемести одну из своих ловушек на любую другую территорию."
        },

        {
            name: "Облава",
            description:
                "Все игроки, находящиеся впереди тебя на маршруте, отступают на <b>1 клетку</b>."
        },

        {
            name: "Короткий путь",
            description:
                "Переместись вперёд на <b>3 клетки</b>, но эффект клетки назначения всё равно срабатывает."
        },

        {
            name: "Чёрный день",
            description:
                "Все игроки с <b>50 HP</b> и больше теряют <b>15 HP</b>."
        }

    ];


    /*
    ==========================================
    КОЛОДА
    ==========================================
    */

    let deck = [];


    /*
    ==========================================
    НАСТОЯЩАЯ СЛУЧАЙНОСТЬ
    ==========================================
    */

    function secureRandomInt(max) {

        if (max <= 0) {
            throw new Error("Invalid max value");
        }

        const maxUint32 = 0x100000000;

        const limit =
            maxUint32 - (maxUint32 % max);

        const array =
            new Uint32Array(1);

        let randomNumber;

        do {

            crypto.getRandomValues(array);

            randomNumber = array[0];

        } while (randomNumber >= limit);

        return randomNumber % max;
    }


    /*
    ==========================================
    ПЕРЕМЕШИВАНИЕ
    ==========================================
    */

    function shuffle(array) {

        const result = [...array];

        for (
            let i = result.length - 1;
            i > 0;
            i--
        ) {

            const j =
                secureRandomInt(i + 1);

            [
                result[i],
                result[j]
            ] =
            [
                result[j],
                result[i]
            ];
        }

        return result;
    }


    /*
    ==========================================
    СОЗДАНИЕ КОЛОДЫ
    ==========================================
    */

    function createDeck() {

        deck = shuffle(events);

        updateCounter();

    }


    /*
    ==========================================
    СЧЁТЧИК
    ==========================================
    */

    function updateCounter() {

        document.getElementById("counter")
            .textContent =
            `Осталось карт: ${deck.length}`;

    }


    /*
    ==========================================
    ВЫТЯНУТЬ КАРТУ
    ==========================================
    */

    function drawCard() {

        /*
        Если карты закончились —
        автоматически создаём новую колоду.
        */

        if (deck.length === 0) {

            createDeck();

        }


        /*
        Берём последнюю карту
        */

        const event =
            deck.pop();


        updateCounter();


        /*
        Получаем путь к изображению
        */

        const imagePath =
            cardImages[event.name];


        const container =
            document.getElementById(
                "cardContainer"
            );


        /*
        Показываем карту
        */

        container.innerHTML = `

            <div class="card appear">

                <img
                    class="card-image"
                    src="${imagePath}"
                    alt="${event.name}"
                    onerror="imageError(this)"
                >

                <div class="card-info">

                    <div class="card-title">
                        ${event.name}
                    </div>

                    <div class="card-description">
                        ${event.description}
                    </div>

                </div>

            </div>

        `;

    }


    /*
    ==========================================
    ОШИБКА ЗАГРУЗКИ КАРТИНКИ
    ==========================================
    */

    function imageError(image) {

        console.error(
            "Не удалось загрузить:",
            image.src
        );

        image.parentElement.innerHTML = `

            <div class="placeholder">

                ❌ Картинка не найдена

            </div>

        `;

    }


    /*
    ==========================================
    СБРОС КОЛОДЫ
    ==========================================
    */

    function resetDeck() {

        createDeck();


        document.getElementById(
            "cardContainer"
        ).innerHTML = `

            <div class="placeholder">

                Нажми «Вытянуть карту»

            </div>

        `;

    }


    /*
    ==========================================
    ЗАПУСК
    ==========================================
    */

    createDeck();

</script>

</body>
</html>
