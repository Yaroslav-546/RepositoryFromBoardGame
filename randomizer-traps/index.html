<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Рандомизатор ловушек</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #252525 0%,
                    #111 45%,
                    #080808 100%
                );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        .game {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }


        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }


        .subtitle {
            color: #aaa;
            margin-bottom: 20px;
        }


        .counter {
            display: inline-block;

            padding: 8px 16px;
            margin-bottom: 20px;

            border-radius: 20px;

            background: #222;
            color: #ccc;

            font-size: 14px;
        }


        /* =====================================
           ОБЛАСТЬ КАРТЫ
        ===================================== */

        .card-container {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 25px;
        }


        .card {
            width: 360px;
            max-width: 100%;

            background: #151515;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255,255,255,0.08);
        }


        /* =====================================
           КАРТИНКА ЛОВУШКИ

           Исходный размер:
           1244 × 1265

           Картинка НЕ обрезается.
        ===================================== */

        .card-image {
            width: 100%;
            max-width: 360px;
            max-height: 360px;
            min-height: 360px;
            height: auto;

            display: block;

            margin: 0 auto;

            object-fit: contain;
        }


        .card-info {
            padding: 18px;
        }


        .card-title {
            font-size: 25px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .card-description {
            color: #ccc;

            line-height: 1.5;

            font-size: 16px;
        }


        /* =====================================
           ЗАГЛУШКА
        ===================================== */

        .placeholder {
            width: 360px;
            max-width: 100%;

            min-height: 360px;

            display: flex;

            justify-content: center;
            align-items: center;

            border-radius: 14px;

            background: #181818;

            border: 2px dashed #444;

            color: #777;

            font-size: 18px;

            padding: 20px;
        }


        /* =====================================
           КНОПКИ
        ===================================== */

        .buttons {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }


        button {
            border: none;

            border-radius: 10px;

            padding: 14px 24px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background: #e5e5e5;

            color: #111;

            transition:
                transform 0.15s,
                background 0.15s;
        }


        button:hover {
            transform: translateY(-2px);

            background: white;
        }


        button:active {
            transform: translateY(0);
        }


        .reset-button {
            background: #292929;

            color: white;
        }


        .reset-button:hover {
            background: #383838;
        }


        /* =====================================
           АНИМАЦИЯ
        ===================================== */

        .card.appear {
            animation: appear 0.35s ease;
        }


        @keyframes appear {

            from {
                opacity: 0;

                transform:
                    scale(0.96)
                    translateY(10px);
            }

            to {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }

        }


        /* =====================================
           МОБИЛЬНАЯ ВЕРСИЯ
        ===================================== */

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }


            h1 {
                font-size: 25px;
            }


            .card {
                width: 100%;
                max-width: 360px;
            }


            .card-image {
                width: 100%;
                height: auto;
            }


            .placeholder {
                width: 100%;
                min-height: 300px;
            }


            button {
                width: 100%;
                max-width: 360px;
            }

        }

    </style>

</head>


<body>


<div class="game">


    <h1>
        🪤 Рандомизатор ловушек
    </h1>


    <div class="subtitle">
        «Последний злодей»
    </div>


    <div
        class="counter"
        id="counter"
    >
        Осталось ловушек: 9
    </div>


    <div
        class="card-container"
        id="cardContainer"
    >

        <div class="placeholder">
            Нажми «Вытянуть ловушку»
        </div>

    </div>


    <div class="buttons">

        <button onclick="drawCard()">
            🪤 Вытянуть ловушку
        </button>


        <button
            class="reset-button"
            onclick="resetDeck()"
        >
            🔄 Новая колода
        </button>

    </div>


</div>



<script>


/* =========================================
   КАРТИНКИ ЛОВУШЕК
========================================= */


const cardImages = {

    "Ложный путь":
        "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/traps/01_wrong_path.png",

    "Кража":
        "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/traps/02_theft.png",

    "Страшный переулок":
        "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/traps/03_scary_alley.png",

    "Мёртвый конец":
        "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/traps/04_dead_end.png",

    "Капкан":
        "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/traps/05_bear_trap.png",

    "Тёмный переулок":
        "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/traps/06_dark_alley.png",

    "Кровавый след":
        "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/traps/07_bloody_trail.png",

    "Ловушка времени":
        "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/traps/08_time_trap.png",

    "Паника":
        "https://yaroslav-546.github.io/RepositoryFromBoardGame/images/traps/09_panic.png"

};


/* =========================================
   ЛОВУШКИ
========================================= */


const traps = [

    {
        name: "Ложный путь",

        description:
            "Игрок возвращается на <b>2 клетки назад</b> и активирует эффект новой клетки."
    },


    {
        name: "Кража",

        description:
            "Игрок теряет <b>30 HP</b>."
    },


    {
        name: "Страшный переулок",

        description:
            "Игрок теряет <b>10 HP</b> и переходит на следующую клетку. Действует <b>2 наступления</b>."
    },


    {
        name: "Мёртвый конец",

        description:
            "Игрок возвращается на <b>3 клетки назад</b> и активирует <b>x2 эффект</b> новой клетки."
    },


    {
        name: "Капкан",

        description:
            "Игрок теряет <b>30 HP</b> и пропускает следующий ход."
    },


    {
        name: "Тёмный переулок",

        description:
            "Игрок теряет <b>20 HP</b> и возвращается на <b>2 клетки вперёд</b>."
    },


    {
        name: "Кровавый след",

        description:
            "Игрок теряет <b>30 HP</b> сейчас и ещё <b>15 HP</b> в начале следующего хода."
    },


    {
        name: "Ловушка времени",

        description:
            "Вернись на ту клетку, на которой находился в начале своего предыдущего хода."
    },


    {
        name: "Паника",

        description:
            "Следующий наступивший на клетку игрок <b>не активирует её свойства</b>."
    }

];


/* =========================================
   СОХРАНЕНИЕ
========================================= */


/*
   Уникальный ключ сохранения.

   Он хранится отдельно от генератора событий,
   поэтому колоды друг другу не мешают.
*/

const STORAGE_KEY =
    "posledniy_zlodey_trap_randomizer";


/*
   Текущая колода.

   В ней хранятся индексы ловушек,
   а не сами объекты.
*/

let deck = [];


/*
   Индекс последней вытянутой ловушки.
*/

let lastTrapIndex = null;



/* =========================================
   БЕЗОПАСНОЕ СЛУЧАЙНОЕ ЧИСЛО
========================================= */


function secureRandomInt(max) {

    if (max <= 0) {
        throw new Error("Invalid max value");
    }


    const maxUint32 =
        0x100000000;


    const limit =
        maxUint32 -
        (maxUint32 % max);


    const array =
        new Uint32Array(1);


    let randomNumber;


    do {

        crypto.getRandomValues(array);

        randomNumber =
            array[0];

    }

    while (
        randomNumber >= limit
    );


    return randomNumber % max;

}



/* =========================================
   ПЕРЕМЕШИВАНИЕ
========================================= */


function shuffle(array) {

    const result =
        [...array];


    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            secureRandomInt(i + 1);


        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }


    return result;

}



/* =========================================
   СОЗДАНИЕ НОВОЙ КОЛОДЫ
========================================= */


function createDeck() {

    /*
       Создаём массив:

       [0,1,2,3,4,5,6,7,8]

       и перемешиваем его.
    */

    deck =
        shuffle(
            traps.map(
                (_, index) => index
            )
        );


    /*
       Последней карты больше нет.
    */

    lastTrapIndex =
        null;


    /*
       Сохраняем новую колоду.
    */

    saveGame();


    updateCounter();

}



/* =========================================
   СОХРАНЕНИЕ ИГРЫ
========================================= */


function saveGame() {

    const gameState = {

        /*
           Оставшиеся карты.
        */

        deck: deck,


        /*
           Последняя вытянутая карта.
        */

        lastTrapIndex:
            lastTrapIndex

    };


    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(gameState)

    );

}



/* =========================================
   ЗАГРУЗКА СОХРАНЕНИЯ
========================================= */


function loadGame() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    /*
       Если сохранения нет —
       создаём новую колоду.
    */

    if (!saved) {

        createDeck();

        return;
    }


    try {

        const gameState =
            JSON.parse(saved);


        /*
           Проверяем, что deck действительно массив.
        */

        if (
            !Array.isArray(gameState.deck)
        ) {

            createDeck();

            return;
        }


        /*
           Проверяем индексы карт.
        */

        const validDeck =
            gameState.deck.every(
                index =>
                    Number.isInteger(index)
                    &&
                    index >= 0
                    &&
                    index < traps.length
            );


        if (!validDeck) {

            createDeck();

            return;
        }


        /*
           Восстанавливаем колоду.
        */

        deck =
            gameState.deck;


        /*
           Восстанавливаем последнюю карту.
        */

        if (
            Number.isInteger(
                gameState.lastTrapIndex
            )
            &&
            gameState.lastTrapIndex >= 0
            &&
            gameState.lastTrapIndex < traps.length
        ) {

            lastTrapIndex =
                gameState.lastTrapIndex;


            /*
               Сразу показываем
               последнюю вытянутую ловушку.
            */

            showCard(
                traps[lastTrapIndex]
            );

        }


        /*
           Обновляем счётчик.
        */

        updateCounter();

    }


    catch (error) {

        console.error(
            "Ошибка загрузки сохранения:",
            error
        );


        /*
           Если сохранение повреждено —
           создаём новую колоду.
        */

        createDeck();

    }

}



/* =========================================
   СЧЁТЧИК
========================================= */


function updateCounter() {

    document.getElementById(
        "counter"
    ).textContent =

        `Осталось ловушек: ${deck.length}`;

}



/* =========================================
   ПОКАЗАТЬ КАРТУ
========================================= */


function showCard(trap) {

    const imagePath =
        cardImages[trap.name];


    const container =
        document.getElementById(
            "cardContainer"
        );


    container.innerHTML = `

        <div class="card appear">

            <img
                class="card-image"
                src="${imagePath}"
                alt="${trap.name}"
                onerror="imageError(this)"
            >


            <div class="card-info">

                <div class="card-title">
                    ${trap.name}
                </div>


                <div class="card-description">
                    ${trap.description}
                </div>

            </div>

        </div>

    `;

}



/* =========================================
   ВЫТЯНУТЬ ЛОВУШКУ
========================================= */


function drawCard() {

    /*
       Если все 9 ловушек закончились,
       автоматически создаём новую колоду.
    */

    if (deck.length === 0) {

        createDeck();

    }


    /*
       Берём одну карту.
    */

    const trapIndex =
        deck.pop();


    const trap =
        traps[trapIndex];


    /*
       Запоминаем последнюю карту.
    */

    lastTrapIndex =
        trapIndex;


    /*
       Показываем карту.
    */

    showCard(trap);


    /*
       Обновляем счётчик.
    */

    updateCounter();


    /*
       Сохраняем состояние.

       Теперь после F5, закрытия браузера
       или повторного открытия сайта
       эта карта уже не вернётся
       в текущую колоду.
    */

    saveGame();

}



/* =========================================
   ОШИБКА КАРТИНКИ
========================================= */


function imageError(image) {

    console.error(
        "Не удалось загрузить:",
        image.src
    );


    image.parentElement.innerHTML = `

        <div class="placeholder">

            ❌ Картинка не найдена

        </div>

    `;

}



/* =========================================
   НОВАЯ КОЛОДА
========================================= */


function resetDeck() {

    /*
       Удаляем старое сохранение.
    */

    localStorage.removeItem(
        STORAGE_KEY
    );


    /*
       Создаём новую колоду.
    */

    createDeck();


    /*
       Показываем начальную заглушку.
    */

    document.getElementById(
        "cardContainer"
    ).innerHTML = `

        <div class="placeholder">

            Нажми «Вытянуть ловушку»

        </div>

    `;

}



/* =========================================
   ЗАПУСК
========================================= */


/*
   Вместо createDeck()
   теперь загружаем сохранение.
*/

loadGame();


</script>
