<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Последний злодей — HP</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top, #252525 0%, #0d0d0d 45%, #050505 100%);

    color: white;
    padding: 25px;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 25px;
}

.title {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;

    text-shadow:
        0 0 10px rgba(255,255,255,.2),
        0 0 30px rgba(255,0,0,.15);
}

.subtitle {
    color: #888;
    margin-top: 6px;
    font-size: 14px;
}

/* GRID */

.players {
    width: min(1100px, 100%);
    margin: auto;

    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

/* PLAYER CARD */

.player {
    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(35,35,35,.98),
            rgba(12,12,12,.98)
        );

    border: 1px solid #333;
    border-radius: 18px;

    padding: 22px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.5),
        inset 0 0 20px rgba(255,255,255,.02);

    transition:
        transform .2s ease,
        border .3s ease,
        box-shadow .3s ease;
}

.player:hover {
    transform: translateY(-3px);
}

/* LOW HP EFFECT */

.player.low {
    animation: dangerPulse 1.5s infinite;
}

@keyframes dangerPulse {

    0%,100% {
        box-shadow:
            0 15px 40px rgba(0,0,0,.5),
            0 0 0 rgba(255,0,0,0);
    }

    50% {
        box-shadow:
            0 15px 40px rgba(0,0,0,.5),
            0 0 25px rgba(255,0,0,.25);
    }
}

/* BONUS HP */

.player.bonus {
    border-color: #a87500;

    box-shadow:
        0 15px 40px rgba(0,0,0,.5),
        0 0 25px rgba(255,190,0,.15);
}

/* DEAD */

.player.dead {
    filter: grayscale(.7);
    border-color: #500;
}

/* PLAYER NAME */

.name {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 12px;
}

/* HP NUMBERS */

.hp-row {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;
}

.hp {
    font-size: 30px;
    font-weight: 900;
}

.max {
    color: #777;
    font-size: 14px;
}

/* BONUS TEXT */

.bonus-text {
    color: #ffc928;
    font-size: 12px;
    font-weight: bold;

    margin-left: 5px;

    display: none;
}

.player.bonus .bonus-text {
    display: inline;
}

/* STATUS */

.status {
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;

    padding: 5px 9px;

    border-radius: 6px;

    background: rgba(255,255,255,.05);
}

/* HP BAR */

.hp-bar {
    width: 100%;
    height: 20px;

    background: #090909;

    border-radius: 20px;

    overflow: hidden;

    border: 1px solid #333;

    box-shadow:
        inset 0 2px 6px rgba(0,0,0,.8);
}

.hp-fill {
    height: 100%;
    width: 100%;

    border-radius: inherit;

    transition:
        width .45s cubic-bezier(.2,.8,.2,1),
        background .3s ease,
        box-shadow .3s ease;
}

/* COLORS */

.hp-fill.green {
    background: linear-gradient(
        90deg,
        #087f23,
        #18d44c
    );

    box-shadow:
        0 0 14px rgba(24,212,76,.5);
}

.hp-fill.yellow {
    background: linear-gradient(
        90deg,
        #a66a00,
        #ffd21c
    );

    box-shadow:
        0 0 14px rgba(255,210,28,.45);
}

.hp-fill.red {
    background: linear-gradient(
        90deg,
        #8c0808,
        #ff2525
    );

    box-shadow:
        0 0 18px rgba(255,37,37,.6);
}

.hp-fill.bonus {
    background: linear-gradient(
        90deg,
        #b36b00,
        #ffd21c
    );

    box-shadow:
        0 0 18px rgba(255,190,30,.65);
}

.hp-fill.dead {
    background: #333;
    box-shadow: none;
}

/* BUTTONS */

.controls {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;

    margin-top: 16px;
}

button {
    border: none;

    padding: 11px 7px;

    border-radius: 9px;

    background: #222;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform .12s ease,
        background .2s ease;
}

button:hover {
    background: #333;
}

button:active {
    transform: scale(.94);
}

/* DAMAGE */

.damage {
    background: #541313;
}

.damage:hover {
    background: #751717;
}

/* HEAL */

.heal {
    background: #125020;
}

.heal:hover {
    background: #176a2b;
}

/* RESET */

.extra-controls {
    display: flex;
    gap: 8px;

    margin-top: 8px;
}

.extra-controls button {
    flex: 1;
}

.reset-player {
    background: #292929;
}

.reset-player:hover {
    background: #3a3a3a;
}

/* LAST CHANGE */

.last-change {
    margin-top: 12px;

    color: #777;

    font-size: 12px;

    min-height: 15px;
}

/* FOOTER */

.global-controls {
    width: min(1100px, 100%);
    margin: 25px auto 0;

    display: flex;
    gap: 10px;
}

.global-controls button {
    flex: 1;

    padding: 14px;

    background: #171717;
    border: 1px solid #333;
}

.global-controls button:hover {
    background: #252525;
}

/* DEAD MESSAGE */

.dead-message {
    display: none;

    margin-top: 10px;

    text-align: center;

    font-weight: 900;

    color: #ff3333;

    letter-spacing: 2px;
}

.player.dead .dead-message {
    display: block;
}

/* MOBILE */

@media (max-width: 700px) {

    body {
        padding: 12px;
    }

    .players {
        grid-template-columns: 1fr;
    }

    .title {
        font-size: 24px;
    }

    .hp {
        font-size: 26px;
    }

    button {
        padding: 12px 5px;
    }
}

</style>
</head>

<script>

/* -------------------------
   НАСТРОЙКИ
------------------------- */

const MAX_HP = 200;

const players = [
    "Кукловод",
    "Алхимик",
    "Теневик",
    "Диктатор"
];


/* -------------------------
   LOAD HP
------------------------- */

let savedHP =
    localStorage.getItem("lastVillainHP");

let hp;

if (savedHP) {

    hp = JSON.parse(savedHP);

    if (
        !Array.isArray(hp) ||
        hp.length !== players.length
    ) {
        hp = [200, 200, 200, 200];
    }

} else {

    hp = [200, 200, 200, 200];

}


/* -------------------------
   UPDATE PLAYER
------------------------- */

function updatePlayer(id) {

    let value = hp[id];

    const hpText =
        document.getElementById(`hp-${id}`);

    const bar =
        document.getElementById(`bar-${id}`);

    const status =
        document.getElementById(`status-${id}`);

    const player =
        document.getElementById(`player-${id}`);


    /*
       Полоса не может быть длиннее 100%.

       Например:
       200 HP = 100%
       300 HP = 100%
       500 HP = 100%

       Само число HP при этом
       продолжает увеличиваться.
    */

    const percentage =
        Math.min(
            (value / MAX_HP) * 100,
            100
        );


    hpText.textContent = value;

    bar.style.width =
        percentage + "%";


    /* REMOVE OLD COLORS */

    bar.classList.remove(
        "green",
        "yellow",
        "red",
        "dead",
        "bonus"
    );

    player.classList.remove(
        "low",
        "dead",
        "bonus"
    );


    /* DEAD */

    if (value <= 0) {

        bar.classList.add("dead");

        status.textContent =
            "ПОГИБ";

        player.classList.add("dead");

    }


    /* BONUS HP */

    else if (value > MAX_HP) {

        bar.classList.add("bonus");

        status.textContent =
            "БОНУС HP";

        player.classList.add("bonus");

    }


    /* LOW HP */

    else if (value < MAX_HP * 0.30) {

        bar.classList.add("red");

        status.textContent =
            "КРИТИЧЕСКОЕ HP";

        player.classList.add("low");

    }


    /* MEDIUM HP */

    else if (value < MAX_HP * 0.60) {

        bar.classList.add("yellow");

        status.textContent =
            "ОПАСНО";

    }


    /* NORMAL HP */

    else {

        bar.classList.add("green");

        status.textContent =
            "ЗДОРОВ";

    }


    /* SAVE */

    localStorage.setItem(
        "lastVillainHP",
        JSON.stringify(hp)
    );
}


/* -------------------------
   CHANGE HP
------------------------- */

function changeHP(id, amount) {

    const oldHP = hp[id];


    /*
       Верхнего ограничения НЕТ.

       Поэтому:
       200 + 40 = 240
       240 + 40 = 280
       280 + 40 = 320

       и так далее.
    */

    hp[id] += amount;


    /*
       Но HP не может быть меньше 0.
    */

    hp[id] =
        Math.max(
            0,
            hp[id]
        );


    const difference =
        hp[id] - oldHP;


    if (difference > 0) {

        document.getElementById(
            `change-${id}`
        ).textContent =
            `▲ +${difference} HP`;

    }

    else if (difference < 0) {

        document.getElementById(
            `change-${id}`
        ).textContent =
            `▼ ${Math.abs(difference)} HP`;

    }

    else {

        document.getElementById(
            `change-${id}`
        ).textContent =
            `HP не изменилось`;

    }


    updatePlayer(id);
}


/* -------------------------
   RESET PLAYER
------------------------- */

function resetPlayer(id) {

    hp[id] = MAX_HP;


    document.getElementById(
        `change-${id}`
    ).textContent =
        "↻ Игрок сброшен";


    updatePlayer(id);
}


/* -------------------------
   RESET ALL
------------------------- */

function resetAll() {

    const confirmed =
        confirm(
            "Сбросить HP всех игроков до 200?"
        );


    if (!confirmed) return;


    hp = [
        MAX_HP,
        MAX_HP,
        MAX_HP,
        MAX_HP
    ];


    players.forEach((_, id) => {

        document.getElementById(
            `change-${id}`
        ).textContent =
            "↻ Все игроки восстановлены";

        updatePlayer(id);

    });

}


/* -------------------------
   INITIALIZE
------------------------- */

players.forEach((_, id) => {

    updatePlayer(id);

});

</script>
